included:
  - Sources
excluded:
  - .build
  - Tests
opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - first_where
  - contains_over_first_not_nil
  - empty_count
  - sorted_first_last
  - unowned_variable_capture
disabled_rules:
  - todo
  - trailing_comma
  - opening_brace
line_length:
  warning: 140
  error: 180
function_body_length:
  warning: 40
  error: 80
file_length:
  warning: 400
  error: 600
type_body_length:
  warning: 300
  error: 500
identifier_name:
  min_length: 1
force_try: error
force_cast: error
