name: CI

# CI minutes are limited, so nothing runs on push or pull request. Run it on demand:
#   git tag ci-<name> && git push origin ci-<name>   (runs on the tagged commit)
#   a tag containing "perf" or "model" also runs those jobs on the self-hosted reference Macs
#   gh workflow run CI --ref <branch>                 (or "Run workflow" in the Actions tab)
on:
  push:
    tags: ["ci-*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, lint and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Select Xcode
        # The image names Xcode by full version (Xcode_26.0.1.app, ...): pick the newest Xcode 26.
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Module boundaries
        run: scripts/check_imports.sh
      - name: Format
        run: xcrun swift-format lint --strict -r --configuration .swift-format Sources Tests
      - name: SwiftLint
        run: brew install swiftlint && swiftlint --strict
      - name: Build (zero warnings)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Unit, integration, UI model and snapshot tests
        run: GLINT_SNAPSHOT_DIR="$RUNNER_TEMP/snapshots" swift test --parallel
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: snapshots
          path: ${{ runner.temp }}/snapshots
      - name: String Catalog is in sync
        run: |
          mkdir -p "$RUNNER_TEMP/strings"
          swift build --product glint-app -Xswiftc -emit-localized-strings -Xswiftc -emit-localized-strings-path -Xswiftc "$RUNNER_TEMP/strings"
          xcrun xcstringstool sync App/Localizable.xcstrings --stringsdata "$RUNNER_TEMP"/strings/*.stringsdata
          git diff --exit-code App/Localizable.xcstrings || (echo "::error::Run scripts/build_app.sh and commit App/Localizable.xcstrings" && exit 1)

  evals:
    name: Retrieval evals
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Sample corpus eval against baseline
        run: |
          swift build -c release --product glint-eval
          .build/release/glint-eval sample "$RUNNER_TEMP/eval"
          .build/release/glint-eval run "$RUNNER_TEMP/eval" --baseline Evals/baseline.json --out "$RUNNER_TEMP/eval-report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: eval-report
          path: ${{ runner.temp }}/eval-report.json

  performance:
    name: Performance budgets (M1 8 GB reference)
    # The dedicated reference Macs register as self-hosted runners with these labels.
    runs-on: [self-hosted, macOS, glint-perf-m1-8gb]
    # Opt in with a tag such as ci-perf-<name>; only the owner can start jobs on the reference Macs.
    if: contains(github.ref_name, 'perf') && github.actor == github.repository_owner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: GLINT_PERF=1 swift test -c release --filter GlintPerformanceTests

  app:
    name: App bundle
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Tooling
        run: |
          brew install xcodegen
          xcodebuild -downloadComponent MetalToolchain
      - run: scripts/build_app.sh release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: Glint.app
          path: build/Glint.app

  ui-tests:
    name: UI tests (XCUITest)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Tooling
        run: |
          brew install xcodegen
          xcodebuild -downloadComponent MetalToolchain
      - run: mkdir -p Xcode && xcodegen generate --project Xcode && sed -i '' 's|relativePath = \.;|relativePath = ..;|' Xcode/Glint.xcodeproj/project.pbxproj
      - run: >
          xcodebuild test -project Xcode/Glint.xcodeproj -scheme Glint
          -destination 'platform=macOS,arch=arm64' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          -resultBundlePath "$RUNNER_TEMP/UITests.xcresult"
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: UITests.xcresult
          path: ${{ runner.temp }}/UITests.xcresult

  model:
    name: EmbeddingGemma 2 parity and evals (reference Mac)
    # Needs the 1.5 GB checkpoint and the Python reference; runs on the self-hosted reference Macs.
    runs-on: [self-hosted, macOS, glint-perf-m1-8gb]
    # Opt in with a tag such as ci-model-<name>; only the owner can start jobs on the reference Macs.
    if: contains(github.ref_name, 'model') && github.actor == github.repository_owner
    env:
      CHECKPOINT: ${{ vars.GLINT_EG2_DIR }}
      REFERENCE_PYTHON: ${{ vars.GLINT_REFERENCE_PYTHON }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Reference fixtures
        run: $REFERENCE_PYTHON scripts/model/make_parity_fixtures.py "$CHECKPOINT" "$RUNNER_TEMP/fixtures"
      - name: Parity gate (cosine >= 0.999, identical token ids)
        run: >
          TEST_RUNNER_GLINT_EG2_DIR="$CHECKPOINT" TEST_RUNNER_GLINT_EG2_FIXTURES="$RUNNER_TEMP/fixtures"
          xcodebuild test -scheme Glint-Package -configuration Release ENABLE_TESTABILITY=YES
          -destination 'platform=macOS,arch=arm64' ARCHS=arm64 -only-testing:GlintEmbeddingTests
      - name: Retrieval evals with EmbeddingGemma 2
        run: |
          xcodebuild build -scheme glint-eval -configuration Release -destination 'platform=macOS,arch=arm64' ARCHS=arm64 -derivedDataPath build/eval
          build/eval/Build/Products/Release/glint-eval sample "$RUNNER_TEMP/eval"
          build/eval/Build/Products/Release/glint-eval run "$RUNNER_TEMP/eval" --model gemma --model-dir "$CHECKPOINT" --baseline Evals/baseline-embeddinggemma2.json
