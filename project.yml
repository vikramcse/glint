# Generates Glint.xcodeproj: `xcodegen generate`. The Swift package (Package.swift) holds all
# modules and unit tests; this project adds the signed app bundle and the XCUITest suite.
name: Glint
options:
  bundleIdPrefix: app.glint
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Apple silicon only (PRD): Float16 vectors and MLX need arm64.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  GlintPackage:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"
targets:
  Glint:
    type: application
    platform: macOS
    sources:
      - path: Sources/GlintApp
      - path: App/Localizable.xcstrings
        buildPhase: resources
      - path: App/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: GlintPackage
        product: GlintKit
      - package: Sparkle
        product: Sparkle
      - target: glint-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: Glint
        PRODUCT_BUNDLE_IDENTIFIER: app.glint.mac
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Glint.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
  glint-mcp:
    type: tool
    platform: macOS
    sources:
      - path: Sources/GlintMCPTool
    dependencies:
      - package: GlintPackage
        product: GlintMCP
    settings:
      base:
        PRODUCT_NAME: glint-mcp
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES
  GlintAppUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: Glint
    settings:
      base:
        TEST_TARGET_NAME: Glint
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.glint.mac.uitests
        # Library validation would refuse the ad hoc test bundle inside the runner.
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  Glint:
    build:
      targets:
        Glint: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GlintAppUITests
    archive:
      config: Release
